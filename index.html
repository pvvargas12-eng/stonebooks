<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2d3d" />
    <title>Shevchenko Monuments — Catalog</title>
    <meta name="description" content="Internal monument catalog for Shevchenko Monuments." />

    <!-- Field Mode PWA packaging — additive only: lets /field install to an
         iPhone home screen with the SB icon. No effect on desktop rendering. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/sb-field-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SB Field" />

    <!-- One origin, two apps (Paul 2026-07-27: "/sales installed as Field").
         iOS reads the manifest + apple-touch-icon from the LIVE DOM at
         Add-to-Home-Screen time, so a synchronous head script swaps the
         identity before anything can be read. /sales = Stonebooks Sales
         (cream icon); everything else keeps the Field identity. -->
    <script>
      (function () {
        if (!location.pathname.replace(/\/+$/, '').startsWith('/sales')) return
        document.querySelector('link[rel="manifest"]').href = '/sales-manifest.webmanifest'
        document.querySelector('link[rel="apple-touch-icon"]').href = '/sb-sales-icon-180.png'
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'SB Sales'
        document.title = 'Stonebooks Sales'
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
